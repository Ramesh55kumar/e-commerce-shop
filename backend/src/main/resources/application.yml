server:
  port: 8080
spring:
  application:
    name: little-shop-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/little_shop?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
app:
  jwt:
    secret: ${JWT_SECRET:VGhpc0lzRGV2ZWxvcG1lbnRPbmx5U2VjcmV0S2V5Rm9yTG9jYWxVc2VPbmx5ISE=}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
